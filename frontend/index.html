<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080A13" />
    <meta
      name="description"
      content="AdaptEdu - platform belajar SMP/SMA dengan AI Tutor dan Tes Diagnostik."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AdaptEdu</title>
    <script>
      // Terapkan tema sebelum paint pertama agar tidak ada flash.
      // Tanpa preferensi tersimpan -> Dark Mode.
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('adaptedu-theme')
        } catch (error) {
          stored = null
        }
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
